[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthflow-mcp"
version = "0.1.0"
description = "MCP server for Synthflow Voice AI — agent management, calls, transcripts, phone numbers"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp==2.0.0",
    "pydantic>=2.13.4,<3",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=8.4,<10",
]

[project.scripts]
synthflow-mcp = "synthflow_mcp.server:main"
synthflow-mcp-setup = "synthflow_mcp.setup.setup:main"
synthflow-mcp-verify = "synthflow_mcp.setup.verify:main"

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
