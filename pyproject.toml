[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthflow-mcp"
version = "0.1.0"
description = "MCP server for Synthflow: voice agents, calls, numbers and knowledge bases."
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.13.4,<3",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=8.4,<10",
    "pytest-cov>=7.0.0,<8",
]

[project.scripts]
synthflow-mcp = "synthflow_mcp.server:main"
synthflow-mcp-setup = "synthflow_mcp.setup.setup:main"
synthflow-mcp-verify = "synthflow_mcp.setup.verify:main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/synthflow-mcp"
Repository = "https://github.com/RosenAdvertising/synthflow-mcp"
Issues = "https://github.com/RosenAdvertising/synthflow-mcp/issues"

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
